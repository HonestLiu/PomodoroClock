[package]
name = "focus-pomodoro"
version = "1.0.0"
description = "番茄钟 × 任务管理桌面应用"
authors = ["FocusPomodoro"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "focus_pomodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
parking_lot = "0.12"
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# 本地补丁：wry 0.57.0 自定义协议响应必须回到主线程（vendor/wry，详见
# src/wkwebview/class/url_scheme_handler.rs 顶部注释），修复番茄钟长时运行后
# WKURLSchemeTask 跨线程嵌套等待导致的 SIGABRT。升级 wry 时重新核对。
[patch.crates-io]
wry = { path = "vendor/wry" }
